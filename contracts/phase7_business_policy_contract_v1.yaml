    table: dbo.Pricing_Rules
    columns: [PricingRuleID, RuleName, ProductID, CategoryID, StoreID, Channel, MinPrice, MaxPrice, MinMarginPct, MaxDiscountPct, MaxPriceChangePct, Priority, EffectiveFrom, EffectiveTo, ActiveFlag]
    read_only: true
