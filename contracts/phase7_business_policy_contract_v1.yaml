    table: dbo.Product
    columns: [ProductID, CategoryID, Season, BasePrice, CostPrice]
    read_only: true
  product_category:
    table: dbo.Product_Category
    columns: [CategoryID, ParentCategoryID, CategoryName, CategoryLevel, DepartmentName]
    read_only: true
  price_history:
    table: dbo.Product_Price_History
    columns: [PriceHistoryID, ProductID, StoreID, Channel, BasePrice, SellingPrice, DiscountPct, PromotionID, EffectiveFrom, EffectiveTo, PriceReason]
    read_only: true
  decision_log:
    table: dbo.Pricing_Decision_Log
    columns: [PricingDecisionID, DecisionTime, ProductID, StoreID, Channel, CurrentPrice, RecommendedPrice, AppliedPrice, PricingRuleID]
    read_only: true
rules:
  scope_null_is_wildcard: true
  effective_dates: '[EffectiveFrom, EffectiveTo)'
  precedence: train-inferred among P1/P2/P3/P4 plus source-backed constraint-adjustment policy, selected only at >=99.5% unique reconciliation
  percentage_convention: normalized to fractions after TRAIN audit
  formulas:
    MinPrice: floor = MinPrice
    MaxPrice: ceiling = MaxPrice
    MinMarginPct: floor = CostPrice / (1 - MinMarginFraction)
    MaxDiscountPct: floor = BasePrice * (1 - MaxDiscountFraction)
    MaxPriceChangePct: bounds = CurrentPrice * (1 +/- MaxPriceChangeFraction)
  conflict: RULE_CONSTRAINT_CONFLICT and manual review
promotions:
  eligibility: ActiveFlag=1, category match, StartDate <= DecisionDate <= EndDate
  season: TRAIN-audited metadata; no invented calendar mapping
  overlap: conflicting discounts require PROMOTION_CONFLICT_REVIEW
  pricing_mode: ENFORCE_DEFINED_DISCOUNT only at >=99% exact-cent agreement, else CONTEXT_ONLY
inventory:
  historical_prohibition: InventorySnapshotDate and AvailableQty remain NULL in historical mode
  current_grain: ProductID + StoreID at max SnapshotDate
  out_of_stock: AvailableQty <= 0 or frozen source status => no price
markdown:
  source_metric: TRAIN product_store_sales_30d, fallback product_sales_30d
  threshold: category p25 when >=100 TRAIN rows else global p25
  eligibility: seasonal + slow-moving + overstock + AvailableQty > 0, current mode only
  expiry_logic: forbidden; dataset has no expiry or perishability fields
decisioning:
  objective: EXPECTED_GROSS_PROFIT
  final_price: model-scored Phase 6 candidates only, with exact supported boundary augmentation
  tie_policy: closest to CurrentPrice, lower price, deterministic candidate order
  materiality: 0.5% relative expected-gross-profit uplift when CurrentPrice is compliant
  advisory_only: true
  auto_writeback: false
