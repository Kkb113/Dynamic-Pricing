    columns: [InventoryID, StoreID, ProductID, SnapshotDate, OpeningQty, ReceivedQty, SoldQty, ReturnedQty, AdjustmentQty, ReservedQty, OnHandQty, AvailableQty, StockStatus]
    read_only: true
