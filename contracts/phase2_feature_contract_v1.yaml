version: 1
name: phase2_point_in_time_feature_contract
grain: one row per PricingDecisionID
deny_by_default: true
defaults: &feature_defaults
  role: CORE_MODEL_FEATURE
  feature_group: core
  source_tables: [Pricing_Decision_Log]
  dtype: float
  formula_or_semantics: source value or deterministic point-in-time transformation
  point_in_time_rule: known at DecisionTime; no outcome or future source rows
  window: decision-time snapshot
  price_dependent: false
  conditional: false
  model_eligible: true
  null_semantics: source null is preserved unless a documented count absence is zero
  fallback_policy: none

features:
  - <<: *feature_defaults
    name: PricingDecisionID
    role: ROW_IDENTIFIER
    dtype: string
    model_eligible: false
    formula_or_semantics: source decision identifier
    null_semantics: never null
  - <<: *feature_defaults
    name: DecisionTime
    role: AUDIT_ONLY
    dtype: datetime
    model_eligible: false
    formula_or_semantics: source decision timestamp and calendar derivation anchor
  - <<: *feature_defaults
    name: CustomerID
    role: JOIN_ONLY
    dtype: string
    model_eligible: false
    source_tables: [Pricing_Decision_Log, Customer]
    formula_or_semantics: source customer key used only for temporal joins
  - <<: *feature_defaults
    name: SessionID
    role: JOIN_ONLY
    dtype: string
    model_eligible: false
    source_tables: [Pricing_Decision_Log, Browsing_Events, Cart_Events, Search_Events]
    formula_or_semantics: source session key retained for audit only
  - <<: *feature_defaults
    name: PurchasedFlag
    role: TARGET
    dtype: int8
    model_eligible: false
    formula_or_semantics: source purchase label
    null_semantics: never null in the accepted source
  - <<: *feature_defaults
    name: QuantityPurchased
    role: TARGET
    dtype: int64
    model_eligible: false
    formula_or_semantics: source quantity label; zero is the observed non-purchase value
    null_semantics: never null in the accepted source
  - <<: *feature_defaults
    name: ProductID
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_high_cardinality
    source_tables: [Pricing_Decision_Log, Product]
    dtype: category
    conditional: true
    formula_or_semantics: product categorical context; preserve raw for later CatBoost evaluation
  - <<: *feature_defaults
    name: StoreID
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_high_cardinality
    source_tables: [Pricing_Decision_Log, Store]
    dtype: category
    conditional: true
    formula_or_semantics: store categorical context; no one-hot or future frequency encoding
  - <<: *feature_defaults
    name: Channel
    feature_group: context
    source_tables: [Pricing_Decision_Log]
    dtype: category
    formula_or_semantics: offered channel
  - <<: *feature_defaults
    name: CategoryID
    feature_group: context
    source_tables: [Product]
    dtype: category
    formula_or_semantics: product category context
  - <<: *feature_defaults
    name: BrandID
    feature_group: context
    source_tables: [Product]
    dtype: category
    formula_or_semantics: product brand context
  - <<: *feature_defaults
    name: Season
    feature_group: context
    source_tables: [Product]
    dtype: category
    formula_or_semantics: source product season
  - <<: *feature_defaults
    name: StoreType
    feature_group: context
    source_tables: [Store]
    dtype: category
    formula_or_semantics: point-in-time store type context
  - <<: *feature_defaults
    name: RegionID
    feature_group: context
    source_tables: [Store, Region]
    dtype: category
    formula_or_semantics: store region context
  - <<: *feature_defaults
    name: ClimateZone
    feature_group: context
    source_tables: [Region]
    dtype: category
    formula_or_semantics: region climate zone
  - <<: *feature_defaults
    name: CurrentPrice
    feature_group: price
    source_tables: [Pricing_Decision_Log]
    dtype: float
    price_dependent: true
    formula_or_semantics: historical current price supplied to the decision
  - <<: *feature_defaults
    name: AppliedPrice
    feature_group: price
    source_tables: [Pricing_Decision_Log]
    dtype: float
    price_dependent: true
    formula_or_semantics: historical offered/treatment price; candidate-price substitution input
  - <<: *feature_defaults
    name: BasePrice
    feature_group: price
    source_tables: [Product]
    dtype: float
    price_dependent: true
    formula_or_semantics: source product base price
  - <<: *feature_defaults
    name: price_change_amount
    feature_group: price
    source_tables: [Pricing_Decision_Log]
    dtype: float
    price_dependent: true
    formula_or_semantics: AppliedPrice - CurrentPrice
    null_semantics: null when either source price is null
  - <<: *feature_defaults
    name: price_change_pct
    feature_group: price
    source_tables: [Pricing_Decision_Log]
    dtype: float
    price_dependent: true
    formula_or_semantics: (AppliedPrice - CurrentPrice) / CurrentPrice
    null_semantics: null when CurrentPrice <= 0
  - <<: *feature_defaults
    name: price_vs_base_pct
    feature_group: price
    source_tables: [Pricing_Decision_Log, Product]
    dtype: float
    price_dependent: true
    formula_or_semantics: (AppliedPrice - BasePrice) / BasePrice
    null_semantics: null when BasePrice <= 0
  - <<: *feature_defaults
    name: current_vs_base_pct
    feature_group: price
    source_tables: [Pricing_Decision_Log, Product]
    dtype: float
    price_dependent: true
    formula_or_semantics: (CurrentPrice - BasePrice) / BasePrice
    null_semantics: null when BasePrice <= 0
  - <<: *feature_defaults
    name: discount_from_base_pct
    feature_group: price
    source_tables: [Pricing_Decision_Log, Product]
    dtype: float
    price_dependent: true
    formula_or_semantics: (BasePrice - AppliedPrice) / BasePrice
    null_semantics: null when BasePrice <= 0
  - <<: *feature_defaults
    name: active_history_selling_price
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: float
    formula_or_semantics: SellingPrice from the active half-open price interval
  - <<: *feature_defaults
    name: history_discount_pct
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: float
    formula_or_semantics: DiscountPct from the active half-open price interval
  - <<: *feature_defaults
    name: days_since_current_price_started
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: float
    formula_or_semantics: days between DecisionTime and active EffectiveFrom
  - <<: *feature_defaults
    name: previous_selling_price
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: float
    formula_or_semantics: SellingPrice from the immediately preceding interval in the same product/store/channel scope
    null_semantics: null when no legitimate preceding interval exists
  - <<: *feature_defaults
    name: previous_price_change_pct
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: float
    formula_or_semantics: (active SellingPrice - previous SellingPrice) / previous SellingPrice
    null_semantics: null when no prior price or prior price <= 0
  - <<: *feature_defaults
    name: active_history_promotion_id
    role: AUDIT_ONLY
    feature_group: promotion
    source_tables: [Product_Price_History]
    dtype: string
    model_eligible: false
    formula_or_semantics: promotion key attached to the active price interval
  - <<: *feature_defaults
    name: active_price_history_id
    role: AUDIT_ONLY
    feature_group: price_history
    source_tables: [Product_Price_History]
    dtype: string
    model_eligible: false
    formula_or_semantics: deterministic selected price-history row identifier
  - <<: *feature_defaults
    name: price_history_current_price_delta
    role: AUDIT_ONLY
    feature_group: price_history
    source_tables: [Pricing_Decision_Log, Product_Price_History]
    dtype: float
    model_eligible: false
    formula_or_semantics: CurrentPrice - active history SellingPrice diagnostic
  - <<: *feature_defaults
    name: price_history_current_price_mismatch
    role: AUDIT_ONLY
    feature_group: price_history
    source_tables: [Pricing_Decision_Log, Product_Price_History]
    dtype: boolean
    model_eligible: false
    formula_or_semantics: absolute current/history price delta exceeds tolerance
  - <<: *feature_defaults
    name: active_promotion_flag
    feature_group: promotion
    source_tables: [Product_Price_History, Promotions]
    dtype: int8
    formula_or_semantics: active price interval promotion resolves and DecisionDate is within StartDate..EndDate
    null_semantics: zero when no valid active promotion
  - <<: *feature_defaults
    name: active_promotion_discount_pct
    feature_group: promotion
    source_tables: [Product_Price_History, Promotions]
    dtype: float
    formula_or_semantics: resolved promotion DiscountPct only when temporally active
    null_semantics: null when no valid active promotion
  - <<: *feature_defaults
    name: decision_month
    feature_group: calendar
    source_tables: [Pricing_Decision_Log]
    dtype: int8
    formula_or_semantics: DecisionTime month, 1 through 12
  - <<: *feature_defaults
    name: decision_quarter
    feature_group: calendar
    source_tables: [Pricing_Decision_Log]
    dtype: int8
    formula_or_semantics: DecisionTime quarter, 1 through 4
  - <<: *feature_defaults
    name: decision_day_of_week
    feature_group: calendar
    source_tables: [Pricing_Decision_Log]
    dtype: int8
    formula_or_semantics: DecisionTime day of week, Monday=0 through Sunday=6
  - <<: *feature_defaults
    name: decision_is_weekend
    feature_group: calendar
    source_tables: [Pricing_Decision_Log]
    dtype: int8
    formula_or_semantics: one when day of week is Saturday or Sunday
  - <<: *feature_defaults
    name: product_store_sales_7d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and StoreID in [DecisionDate-7, DecisionDate)
  - <<: *feature_defaults
    name: product_store_sales_14d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and StoreID in [DecisionDate-14, DecisionDate)
  - <<: *feature_defaults
    name: product_store_sales_30d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and StoreID in [DecisionDate-30, DecisionDate)
  - <<: *feature_defaults
    name: product_region_sales_7d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Store]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and sale Store RegionID in [DecisionDate-7, DecisionDate)
  - <<: *feature_defaults
    name: product_region_sales_14d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Store]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and sale Store RegionID in [DecisionDate-14, DecisionDate)
  - <<: *feature_defaults
    name: product_region_sales_30d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Store]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID and sale Store RegionID in [DecisionDate-30, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_7d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID in [DecisionDate-7, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_14d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID in [DecisionDate-14, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_30d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID in [DecisionDate-30, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_60d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID in [DecisionDate-60, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_90d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line]
    dtype: float
    formula_or_semantics: sum eligible line Qty by ProductID in [DecisionDate-90, DecisionDate)
  - <<: *feature_defaults
    name: category_store_sales_7d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID and StoreID in [DecisionDate-7, DecisionDate)
  - <<: *feature_defaults
    name: category_store_sales_14d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID and StoreID in [DecisionDate-14, DecisionDate)
  - <<: *feature_defaults
    name: category_store_sales_30d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID and StoreID in [DecisionDate-30, DecisionDate)
  - <<: *feature_defaults
    name: category_sales_7d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID in [DecisionDate-7, DecisionDate)
  - <<: *feature_defaults
    name: category_sales_14d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID in [DecisionDate-14, DecisionDate)
  - <<: *feature_defaults
    name: category_sales_30d
    feature_group: sales
    source_tables: [Sales_Order, Sales_Order_Line, Product]
    dtype: float
    formula_or_semantics: sum eligible line Qty by CategoryID in [DecisionDate-30, DecisionDate)
  - <<: *feature_defaults
    name: product_sales_velocity_7d
    feature_group: sales
    dtype: float
    formula_or_semantics: product_sales_7d / 7
  - <<: *feature_defaults
    name: product_sales_velocity_30d
    feature_group: sales
    dtype: float
    formula_or_semantics: product_sales_30d / 30
  - <<: *feature_defaults
    name: product_sales_velocity_90d
    feature_group: sales
    dtype: float
    formula_or_semantics: product_sales_90d / 90
  - <<: *feature_defaults
    name: product_sales_velocity_ratio_7d_30d
    feature_group: sales
    dtype: float
    formula_or_semantics: velocity_7d / velocity_30d using safe division
    null_semantics: null when 30-day velocity is not positive
  - <<: *feature_defaults
    name: days_since_last_product_sale
    feature_group: sales
    dtype: float
    formula_or_semantics: days since latest eligible product sale strictly before DecisionDate
    null_semantics: null when no prior eligible product sale exists
  - <<: *feature_defaults
    name: competitor_price_exact_channel
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: float
    formula_or_semantics: latest non-future competitor price by ProductID, RegionID, exact Channel within 30 days
    fallback_policy: no fallback; null when exact context is absent
  - <<: *feature_defaults
    name: competitor_price_region_fallback
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: float
    formula_or_semantics: latest non-future ProductID and RegionID competitor price across channels within 30 days
    fallback_policy: region fallback is visibly distinct from exact channel
  - <<: *feature_defaults
    name: competitor_price_product_fallback
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: float
    formula_or_semantics: latest non-future ProductID competitor price across regions/channels within 30 days
    fallback_policy: product fallback is visibly distinct from region/exact
  - <<: *feature_defaults
    name: competitor_price
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: float
    price_dependent: true
    formula_or_semantics: selected competitor value by exact, region, then product precedence
    fallback_policy: exact > region > product > null
  - <<: *feature_defaults
    name: competitor_price_available
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: int8
    formula_or_semantics: one when a legitimate competitor context is selected
  - <<: *feature_defaults
    name: competitor_price_age_days
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: float
    formula_or_semantics: DecisionTime minus selected ObservedDateTime in days
    null_semantics: null when no competitor context
  - <<: *feature_defaults
    name: competitor_match_level
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Competitor_Price]
    dtype: category
    formula_or_semantics: EXACT, REGION_FALLBACK, PRODUCT_FALLBACK, or NONE
    fallback_policy: explicit level is preserved; fallback is never mislabeled exact
  - <<: *feature_defaults
    name: price_vs_competitor_pct
    role: OPTIONAL_MODEL_FEATURE
    feature_group: optional_competitor
    source_tables: [Pricing_Decision_Log, Competitor_Price]
    dtype: float
    price_dependent: true
    formula_or_semantics: (offered price - selected competitor price) / selected competitor price
    null_semantics: null when selected competitor price is absent or non-positive
  - <<: *feature_defaults
    name: product_views_1h
    feature_group: behavior
    source_tables: [Browsing_Events]
    dtype: float
    formula_or_semantics: count of product/customer browsing events in [DecisionTime-1h, DecisionTime]
  - <<: *feature_defaults
    name: product_views_24h
    feature_group: behavior
    source_tables: [Browsing_Events]
    dtype: float
    formula_or_semantics: count of product/customer browsing events in [DecisionTime-24h, DecisionTime]
  - <<: *feature_defaults
    name: product_views_168h
    feature_group: behavior
    source_tables: [Browsing_Events]
    dtype: float
    formula_or_semantics: count of product/customer browsing events in [DecisionTime-168h, DecisionTime]
  - <<: *feature_defaults
    name: product_views_720h
    feature_group: behavior
    source_tables: [Browsing_Events]
    dtype: float
    formula_or_semantics: count of product/customer browsing events in [DecisionTime-720h, DecisionTime]
  - <<: *feature_defaults
    name: cart_additions_1h
    feature_group: behavior
    source_tables: [Cart_Events]
    dtype: float
    formula_or_semantics: count validated Action=Add cart events in [DecisionTime-1h, DecisionTime]
  - <<: *feature_defaults
    name: cart_additions_24h
    feature_group: behavior
    source_tables: [Cart_Events]
    dtype: float
    formula_or_semantics: count validated Action=Add cart events in [DecisionTime-24h, DecisionTime]
  - <<: *feature_defaults
    name: cart_additions_168h
    feature_group: behavior
    dtype: float
    source_tables: [Cart_Events]
    formula_or_semantics: count validated Action=Add cart events in [DecisionTime-168h, DecisionTime]
  - <<: *feature_defaults
    name: cart_additions_720h
    feature_group: behavior
    dtype: float
    source_tables: [Cart_Events]
    formula_or_semantics: count validated Action=Add cart events in [DecisionTime-720h, DecisionTime]
  - <<: *feature_defaults
    name: search_clicks_1h
    feature_group: behavior
    source_tables: [Search_Events]
    dtype: float
    formula_or_semantics: count clicked-product search events in [DecisionTime-1h, DecisionTime]
  - <<: *feature_defaults
    name: search_clicks_24h
    feature_group: behavior
    source_tables: [Search_Events]
    dtype: float
    formula_or_semantics: count clicked-product search events in [DecisionTime-24h, DecisionTime]
  - <<: *feature_defaults
    name: search_clicks_168h
    feature_group: behavior
    source_tables: [Search_Events]
    dtype: float
    formula_or_semantics: count clicked-product search events in [DecisionTime-168h, DecisionTime]
  - <<: *feature_defaults
    name: search_clicks_720h
    feature_group: behavior
    source_tables: [Search_Events]
    dtype: float
    formula_or_semantics: count clicked-product search events in [DecisionTime-720h, DecisionTime]
  - <<: *feature_defaults
    name: is_holiday
    feature_group: holiday_weather
    source_tables: [Holiday, Store]
    dtype: int8
    formula_or_semantics: decision date has a region-specific or general holiday
  - <<: *feature_defaults
    name: holiday_sales_impact_factor
    feature_group: holiday_weather
    source_tables: [Holiday, Store]
    dtype: float
    formula_or_semantics: maximum applicable SalesImpactFactor for date and region
    null_semantics: null when not a holiday
  - <<: *feature_defaults
    name: holiday_count
    role: AUDIT_ONLY
    feature_group: holiday_weather
    source_tables: [Holiday, Store]
    dtype: int16
    model_eligible: false
    formula_or_semantics: count of applicable holidays; prevents row multiplication
  - <<: *feature_defaults
    name: weather_temperature
    feature_group: holiday_weather
    source_tables: [Weather, Store]
    dtype: float
    formula_or_semantics: Weather.TemperatureF at Store.RegionID and DecisionDate
  - <<: *feature_defaults
    name: weather_condition
    feature_group: holiday_weather
    source_tables: [Weather, Store]
    dtype: category
    formula_or_semantics: Weather.Condition at Store.RegionID and DecisionDate
  - <<: *feature_defaults
    name: weather_precipitation
    feature_group: holiday_weather
    source_tables: [Weather, Store]
    dtype: float
    formula_or_semantics: Weather.PrecipitationIn at Store.RegionID and DecisionDate
  - <<: *feature_defaults
    name: CustomerSegment
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer]
    dtype: category
    conditional: true
    formula_or_semantics: customer segment context; conditional feature only
  - <<: *feature_defaults
    name: LoyaltyTier
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer]
    dtype: category
    conditional: true
    formula_or_semantics: customer loyalty tier; conditional feature only
  - <<: *feature_defaults
    name: PreferredChannel
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer]
    dtype: category
    conditional: true
    formula_or_semantics: customer preferred channel; conditional feature only
  - <<: *feature_defaults
    name: PriceSensitivity
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer_Preferences]
    dtype: category
    conditional: true
    formula_or_semantics: customer price-sensitivity context; conditional feature only
  - <<: *feature_defaults
    name: CategoryAffinityScore
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer_Preferences]
    dtype: float
    conditional: true
    formula_or_semantics: source category affinity score; conditional feature only
  - <<: *feature_defaults
    name: BrandAffinityScore
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer_Preferences]
    dtype: float
    conditional: true
    formula_or_semantics: source brand affinity score; conditional feature only
  - <<: *feature_defaults
    name: FavoriteCategoryID
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer_Preferences]
    dtype: category
    conditional: true
    formula_or_semantics: customer favorite category context; conditional feature only
  - <<: *feature_defaults
    name: FavoriteBrandID
    role: CONDITIONAL_MODEL_FEATURE
    feature_group: conditional_customer
    source_tables: [Customer_Preferences]
    dtype: category
    conditional: true
    formula_or_semantics: customer favorite brand context; conditional feature only

feature_lists:
  purchase_core_features: &purchase_core_features
    - CurrentPrice
    - AppliedPrice
    - BasePrice
    - price_change_amount
    - price_change_pct
    - price_vs_base_pct
    - current_vs_base_pct
    - discount_from_base_pct
    - active_history_selling_price
    - history_discount_pct
    - days_since_current_price_started
    - previous_selling_price
    - previous_price_change_pct
    - decision_month
    - decision_quarter
    - decision_day_of_week
    - decision_is_weekend
    - CategoryID
    - BrandID
    - Season
    - StoreType
    - RegionID
    - ClimateZone
