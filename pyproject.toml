[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellify-dynamic-pricing"
version = "0.2.0"
requires-python = ">=3.11,<3.13"
dependencies = ["PyYAML>=6.0", "pandas>=2.0", "pyarrow>=12.0", "numpy>=1.24", "catboost>=1.2", "psutil>=5.9", "fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.27"]
agent = ["openai-agents>=0.2"]
training = ["scikit-learn>=1.3", "joblib>=1.3", "threadpoolctl>=3.2", "optuna>=3.5"]
extraction = ["pyodbc>=4.0", "pymssql>=2.3"]
legacy-ui = ["streamlit>=1.37", "plotly>=5.18"]
all = ["openai-agents>=0.2", "scikit-learn>=1.3", "joblib>=1.3", "threadpoolctl>=3.2", "optuna>=3.5", "pyodbc>=4.0", "pymssql>=2.3", "streamlit>=1.37", "plotly>=5.18", "pytest>=7.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.scripts]
phase1-audit = "audit.report_builder:main"
phase1-validate = "audit.validation_runner:main"
phase2-build = "features.validation_runner:main"
phase3-validate = "validation.runner:main"

