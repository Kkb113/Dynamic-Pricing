name: azure-databricks-pricing-phase1
on:
  pull_request:
    paths:
      - 'azure_databricks/**'
      - 'src/pricing_mlflow/**'
      - 'artifacts/azure_databricks/phase3/**'
      - '.github/workflows/azure-databricks-phase1.yml'
  push:
    branches: ['codex/azure-phase1-governance-transfer', 'codex/azure-phase2-lakehouse', 'codex/azure-phase3-mlflow-serving']
permissions:
  contents: read
jobs:
  governance-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r azure_databricks/requirements-mlflow.txt
      - run: python -m unittest discover -s azure_databricks/tests -v
      - run: python azure_databricks/scripts/phase1.py plan
      - run: python azure_databricks/scripts/phase2.py plan
      - run: python azure_databricks/scripts/phase3.py plan --evidence build/linux_phase3/plan.json
      - run: python azure_databricks/scripts/phase3.py validate-package --evidence build/linux_phase3/package.json
      - run: python azure_databricks/scripts/phase3.py validate-local --evidence build/linux_phase3/optimizer.json
      - run: python azure_databricks/scripts/phase3.py validate-business --policy-snapshot artifacts/azure_databricks/phase3/policy --evidence build/linux_phase3/business.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-phase3-acceptance
          path: build/linux_phase3/
