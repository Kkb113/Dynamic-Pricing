name: azure-databricks-pricing-phase1
on:
  pull_request:
    paths:
      - 'azure_databricks/**'
      - '.github/workflows/azure-databricks-phase1.yml'
  push:
    branches: ['codex/azure-phase1-governance-transfer']
permissions:
  contents: read
jobs:
  governance-and-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s azure_databricks/tests -v
      - run: python azure_databricks/scripts/phase1.py plan
