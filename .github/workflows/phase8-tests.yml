name: phase8-tests

on:
  push:
    branches:
      - codex/phase8-business-backtesting-evaluation
  pull_request:
    paths:
      - 'src/phase8/**'
      - 'tests/phase8/**'
      - 'contracts/phase8_business_evaluation_contract_v1.yaml'
      - 'config/phase8_business_evaluation.yaml'
      - '.github/workflows/phase8-tests.yml'

jobs:
  deterministic-evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      # conftest.py imports the repository audit hook, which requires pyodbc;
      # the Phase 8 tests themselves use deterministic fixtures and no SQL.
      - run: python -m pip install pandas numpy pyarrow pyyaml pytest pyodbc scikit-learn
      - run: pytest -q tests/phase8
        env:
          TEST_EVIDENCE_PATH: artifacts/phase8/test_results.json
