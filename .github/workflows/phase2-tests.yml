name: Phase 2 deterministic tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: $env:TEST_EVIDENCE_PATH="artifacts/phase2/test_results.json"; pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-pytest-evidence
          path: artifacts/phase2/test_results.json
