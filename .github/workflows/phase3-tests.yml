name: phase3-tests

on:
  push:
    branches: ["codex/phase3-temporal-baselines"]
  pull_request:
    paths:
      - "src/validation/**"
      - "src/baselines/**"
      - "tests/phase3/**"
      - "config/phase3_baselines.yaml"
      - "contracts/phase3_temporal_validation_contract_v1.yaml"
      - "pyproject.toml"
      - ".github/workflows/phase3-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 3 tests
        env:
          TEST_EVIDENCE_PATH: artifacts/phase3/test_results.json
        run: python -m pytest -q
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-test-evidence
          path: artifacts/phase3/test_results.json
