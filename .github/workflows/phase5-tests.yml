name: Phase 5 tests

on:
  push:
    paths:
      - "src/models/quantity_*.py"
      - "src/demand/**"
      - "src/phase5/**"
      - "tests/phase5/**"
      - "contracts/phase5_quantity_demand_contract_v1.yaml"
      - "config/phase5_quantity.yaml"
      - ".github/workflows/phase5-tests.yml"
  pull_request:
    paths:
      - "src/models/quantity_*.py"
      - "src/demand/**"
      - "src/phase5/**"
      - "tests/phase5/**"
      - "contracts/phase5_quantity_demand_contract_v1.yaml"
      - "config/phase5_quantity.yaml"
      - ".github/workflows/phase5-tests.yml"

jobs:
  phase5-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip; python -m pip install -e ".[test]"
      - name: Run deterministic Phase 5 fixture tests
        run: python -m pytest tests/phase5 -q
