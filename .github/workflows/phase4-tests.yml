name: Phase 4 CatBoost tests

on:
  push:
    branches: ["codex/phase4-catboost-purchase-model"]
  pull_request:
    paths:
      - "src/models/**"
      - "src/phase4/**"
      - "tests/phase4/**"
      - "contracts/phase4_purchase_model_contract_v1.yaml"
      - "config/phase4_catboost.yaml"
      - "pyproject.toml"
      - ".github/workflows/phase4-tests.yml"

jobs:
  phase4-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Phase 4 unit and fixture tests
        run: python -m pytest -q tests/phase4

