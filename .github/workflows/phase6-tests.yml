name: Phase 6 tests

on:
  push:
    paths:
      - "src/optimization/**"
      - "src/phase6/**"
      - "tests/phase6/**"
      - "contracts/phase6_price_optimization_contract_v1.yaml"
      - "config/phase6_optimizer.yaml"
      - ".github/workflows/phase6-tests.yml"
  pull_request:
    paths:
      - "src/optimization/**"
      - "src/phase6/**"
      - "tests/phase6/**"
      - "contracts/phase6_price_optimization_contract_v1.yaml"
      - "config/phase6_optimizer.yaml"
      - ".github/workflows/phase6-tests.yml"

jobs:
  phase6-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --upgrade pip; python -m pip install -e ".[test]"
      - name: Run deterministic Phase 6 fixture tests
        run: python -m pytest tests/phase6 -q
