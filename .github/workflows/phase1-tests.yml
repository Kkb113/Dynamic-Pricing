name: Phase 1 tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-pytest-evidence
          path: artifacts/phase1/test_results.json
