name: phase7-tests

on:
  push:
    branches:
      - codex/phase7-business-rules-promotions-markdowns
  pull_request:
    paths:
      - 'src/business_rules/**'
      - 'src/promotions/**'
      - 'src/inventory_policy/**'
      - 'src/decisioning/**'
      - 'src/phase7/**'
      - 'tests/phase7/**'
      - 'contracts/phase7_business_policy_contract_v1.yaml'
      - 'config/phase7_business_policy.yaml'
      - '.github/workflows/phase7-tests.yml'

jobs:
  deterministic-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      # conftest.py's session audit hook imports audit.database_profile, which
      # requires pyodbc even though these deterministic tests do not connect
      # to SQL Server.
      - run: python -m pip install pandas numpy pyarrow pyyaml pytest pyodbc
      - run: pytest -q tests/phase7

